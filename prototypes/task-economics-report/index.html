<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway mock. FAKE DATA, for format review only.
  Question (issue #8): How should the published Task Economics Report look?
  Three structurally different variants, switchable via ?variant=a|b|c,
  floating bottom bar, and ←/→ arrow keys.
  Branch: prototype/task-economics-report-format. Never merges.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Economics Report — prototype (fake data)</title>
<style>
  :root{
    --ink:#1a2333; --muted:#5b6a80; --line:#e3e8f0; --bg:#f6f8fb; --card:#fff;
    --accent:#0d6efd; --accent-dim:#e8f1ff; --good:#0e9f6e; --bad:#d14343; --warn:#b45309;
    --premium:#7c3aed; --standard:#0d6efd; --budget:#0e9f6e;
    font-size:15px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
  h1,h2,h3{line-height:1.2}
  .muted{color:var(--muted)}
  .small{font-size:.78rem}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  table{width:100%;border-collapse:collapse;background:var(--card)}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbfe}
  tr:last-child td{border-bottom:none}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .tier{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600;color:#fff}
  .tier.premium{background:var(--premium)}
  .tier.standard{background:var(--standard)}
  .tier.budget{background:var(--budget)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .fake-ribbon{position:fixed;top:10px;left:10px;z-index:99;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .ev{white-space:nowrap}
  .ev a{margin:0 2px;font-size:.8rem}
  /* evidence glyphs */
  .ev a.cfg{color:#0d6efd}.ev a.cost{color:#0e9f6e}.ev a.trace{color:#7c3aed}

  /* ---- switcher (not part of the design being evaluated) ---- */
  #switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#111827;color:#e5e7eb;border-radius:999px;padding:8px 18px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:100;font-size:.85rem}

  #switcher button:hover{background:#374151}
  #switcher .key{font-size:.68rem;color:#9ca3af}
  .fake-banner{background:#fff4e5;border:1px solid #f0d9b0;color:#8a5a00;border-radius:8px;padding:6px 12px;font-size:.8rem;margin:14px 0}

  /* ---- variant A: leaderboard ---- */
  .vA .mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding:18px 0 12px;flex-wrap:wrap;gap:10px}
  .vA .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:12px;flex-wrap:wrap}
  .vA .tab{padding:8px 16px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;background:transparent}
  .vA .tab.on{color:var(--ink);border-color:var(--line);background:var(--card)}
  .vA .subtabs{display:flex;gap:8px;padding:10px 0}
  .vA .subtab{padding:4px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--card);font-size:.85rem;font-weight:600}
  .vA .subtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .vA .headline-banner{background:linear-gradient(120deg,#101a33,#1c2c55);color:#fff;border-radius:12px;padding:20px 24px;margin:16px 0;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
  .vA .headline-banner .big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .vA .pill{display:inline-block;background:rgba(255,255,255,.12);border-radius:6px;padding:2px 8px;font-size:.75rem;margin-right:6px}

  .vB .hero{text-align:center;padding:26px 0 30px;border-bottom:1px solid var(--line)}

  .vB figure{margin:18px 0}
  .vB figcaption{font-size:.78rem;color:var(--muted);margin-top:6px}
  .vB sup a{font-size:.68rem}
  .vB .prose{max-width:820px;margin:0 auto}
  .vB .appendix{background:#fbfcfd;border:1px dashed var(--line);border-radius:10px;padding:14px 16px;margin-top:8px}
  .bars{display:flex;flex-direction:column;gap:6px}
  .bar-row{display:grid;grid-template-columns:220px 1fr 90px;gap:10px;align-items:center;font-size:.82rem}
  .bar{height:14px;background:var(--accent-dim);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.pass{background:var(--good)}
  .bar i.fail{background:var(--bad)}

  .vC .full{grid-column:1/-1}
  .vC .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

  .vC #evpanel{position:sticky;top:16px}
  .vC #evpanel .card{border-left:4px solid var(--accent)}
  .vC details{margin:8px 0}
  .vC details summary{cursor:pointer;font-weight:600}
  @media(max-width:960px){.vC{grid-template-columns:1fr}}

function tierBadge(t){return `<span class="tier ${t.toLowerCase()}">${t}</span>`}
function pct(x){return (x*100).toFixed(1)+"%"}
function money(x){return "$"+x.toFixed(2)}
function frontierOf(rows){
  // Pareto frontier: maximize quality, minimize CPET.
  // A point is dominated when a strictly higher-quality config is ≤ its CPET.
  const fr=[]; let bestCpet=Infinity;
  [...rows].sort((a,b)=>b.q-a.q).forEach(r=>{ if(r.cpet<bestCpet){fr.push(r);bestCpet=r.cpet} });
  return fr;
}
function scatterSVG(rows, opts={}){
  const W=660,H=360,pad=44;
  const qs=rows.map(r=>r.q), cs=rows.map(r=>r.cpet);
  const qMin=Math.min(...qs)-.03, qMax=Math.max(...qs)+.03;
  const cMin=Math.min(...cs), cMax=Math.max(...cs);
  const lc=(v)=>Math.log10(v), LMin=lc(cMin), LMax=lc(cMax);
  const X=(q)=>pad+(q-qMin)/(qMax-qMin)*(W-2*pad);
  const Y=(c)=>pad+(1-(lc(c)-LMin)/(LMax-LMin))*(H-2*pad);
  const fr=frontierOf(rows);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="quality vs CPET scatter">`;
  // gridlines + y labels (log)
  for(let i=0;i<=4;i++){const t=i/4, y=pad+t*(H-2*pad), c=Math.pow(10,LMin+(LMax-LMin)*t);
    s+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#eef1f6"/>
        <text x="${pad-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#7a8799">$${c>=10?c.toFixed(0):c.toFixed(1)}</text>`;}
  for(let i=0;i<=5;i++){const q=qMin+i/5*(qMax-qMin), x=X(q);
    s+=`<text x="${x}" y="${H-pad+16}" text-anchor="middle" font-size="10" fill="#7a8799">${q.toFixed(2)}</text>`;}
  s+=`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="#5b6a80">Quality Score (0–1, gate = 1.0)</text>`;
  s+=`<text x="14" y="${H/2}" transform="rotate(-90 14 ${H/2})" text-anchor="middle" font-size="11" fill="#5b6a80">CPET ($, log)</text>`;
  // frontier polyline
  s+=`<polyline points="${fr.map(r=>`${X(r.q)},${Y(r.cpet)}`).join(" ")}" fill="none" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5 4" opacity=".6"/>`;
  // points
  rows.forEach(r=>{
    const on=fr.includes(r), color=on?"#0d6efd":"#b9c2d0";
    s+=`<circle cx="${X(r.q)}" cy="${Y(r.cpet)}" r="${on?7:5}" fill="${color}" stroke="#fff" stroke-width="2">
        <title>${r.name} · Quality ${r.q.toFixed(3)} · CPET ${money(r.cpet)} · Reliability ${pct(r.rel)}${on?" · ON FRONTIER":""}</title></circle>`;
  });
  s+=`</svg>`;
  return s;
}
function bars(items){ // [{label, pass, fail}]
  return `<div class="bars">`+items.map(it=>{
    const t=it.pass+it.fail;
    return `<div class="bar-row"><span class="muted">${it.label}</span>
      <span class="bar" title="pass ${pct(it.pass/t)} · fail ${pct(it.fail/t)}"><i class="pass" style="width:${it.pass/t*100}%"></i><i class="fail" style="width:${it.fail/t*100}%"></i></span>
      <span class="num small">${pct(it.pass/t)} pass</span></div>`;}).join("")+`</div>`;
}

}

    <td>${i+1}</td>
    <td>${tierBadge(m.tier)} <span class="mono">${esc(m.id)}</span></td>
    <td class="num">${m.q.toFixed(3)} <span class="ev">${evLinks("model-"+m.id,"gpqa").replace(/gpqa/g,"modelbench")}</span></td>
    <td class="num">${m.val.toFixed(2)} <span class="ev">${evLinks("model-"+m.id,"value")}</span></td>
    <td class="num">${m.spd} t/s <span class="ev">${evLinks("model-"+m.id,"speed")}</span></td>
    <td class="num muted">${money(m.cost)}/run</td></tr>`).join("");

  const taskTables=TASK_ORDER.map(tk=>{
    const t=TASKS[tk];
    const rows=[...t.configs].sort((a,b)=>a.cpet-b.cpet).map((c,i)=>`<tr>
      <td>${i+1}</td>
      <td>${esc(c.name)}</td>
      <td class="num">${money(c.cpet)} ${evLinks(c.id,tk)}</td>
      <td class="num">${c.q.toFixed(3)} ${evLinks(c.id,tk)}</td>
      <td class="num">${pct(c.rel)} ${evLinks(c.id,tk)}</td>
      <td class="num">${c.eff}</td>
      <td class="num muted">${pct(c.waste/100)}</td></tr>`).join("");
    return `<section class="taskpanel" data-t="${tk}" hidden>
      <h3>${t.name} (${t.cn})</h3>
      <p class="small muted">Seed: ${t.seed} · ${t.license} · ${t.instances} instances · contamination: disclosed (pre-2023 public seed) · difficulty: calibration-derived (hard &lt; ⅓ ≤ medium ≤ ⅔ &lt; easy)</p>
      <table><thead><tr><th>#</th><th>Task Configuration</th><th class="num">CPET</th><th class="num">Quality</th><th class="num">Reliability</th><th class="num">Effective</th><th class="num">Waste</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="card" style="margin-top:14px"><strong>Efficiency diagnosis</strong>
        <ul class="small">${t.diagnosis.map(d=>`<li>${d}</li>`).join("")}</ul></div>
      <div class="card" style="margin-top:10px"><strong>Optimization suggestions</strong>
        <ul class="small">${t.suggestions.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    </section>`;
  }).join("");

  return `<div class="vA wrap">
    <div class="mast"><div>
      <h1 style="margin:0">Task Economics Report <span class="muted" style="font-weight:400">· v1</span></h1>
      <div class="small muted">Benchmark Run ${RUN.id} · ${RUN.date} · epochs ${RUN.epochs} · ${RUN.matrix} · via tokencamp API</div>
    </div><div class="small muted" style="text-align:right">Token Economics +<br>Task Economics (任务经济学)</div></div>
    <div class="fake-banner">PROTOTYPE — every number below is fake data for format review. Links point at the artifact paths of the settled schema, not real files.</div>

    <div class="tabs"><div class="tab on" data-l="model">Model layer</div><div class="tab" data-l="task">Task layer</div></div>
    <section data-layer="model">
      <div class="subtabs"><span class="subtab on">Quality</span><span class="subtab">Value</span><span class="subtab">Speed</span><span class="small muted" style="align-self:center">each score: ⚙ config · $ cost · ⧉ trace</span></div>
      <table><thead><tr><th>#</th><th>Model</th><th class="num">Quality</th><th class="num">Value</th><th class="num">Speed</th><th class="num">Run cost</th></tr></thead>
      <tbody>${modelRows}</tbody></table>
      <p class="small muted">Quality = mean over GPQA-Diamond / HumanEval / MMLU-Pro / IFEval · Value = quality per $, rescaled 0–1 · Speed = median output t/s · 3 epochs each. <a href="#">Methodology &amp; contamination disclosure ↗</a></p>
    </section>
    <section data-layer="task" hidden>
      <div class="headline-banner"><div>
        <div class="small" style="opacity:.75">How much does a customer pay to complete an effective task? <span class="pill">flagship · code generation · medium tier</span></div>
        <div class="big">${TASKS.codegen.headline}</div>
        <div class="small" style="opacity:.85">per effective task · ${TASKS.codegen.headCfg} · quality ${TASKS.codegen.headQ} · reliability ${pct(TASKS.codegen.headRel)} ${evLinks("cg-kimi-ss","mbpp")}</div>
      </div><div class="small" style="opacity:.85">${TASK_ORDER.map(k=>`${TASKS[k].name}: ${TASKS[k].headline}`).join(" · ")}</div></div>
      <div class="subtabs">${TASK_ORDER.map((k,i)=>`<span class="subtab ${i===0?"on":""}" data-t="${k}">${TASKS[k].name}</span>`).join("")}</div>
      <figure style="margin:10px 0">${scatterSVG(TASKS.codegen.configs)}<figcaption class="small muted">Quality vs CPET Pareto frontier — each point = one Task Configuration; dashed line = frontier.</figcaption></figure>
      ${taskTables}
    </section>
    <footer class="small muted" style="margin-top:26px;border-top:1px solid var(--line);padding-top:10px">
      Every published score links to its configuration (⚙), cost ($), and telemetry (⧉) in the run artifact. Contamination disclosure: all public seeds are pre-2023 and heavily trained on (reproducibility over novelty, ADR-0003). Difficulty tiers derived from calibration baseline pass rates. Published by tokencamp benchmarks.
    </footer>
  </div>`;
}

/* =========================== VARIANT B =========================== */
/* "Narrative" — a written report: headline hero, prose, charts inline,
   tables relegated to an appendix; evidence as footnotes. */
function renderB(){
  const cg=TASKS.codegen;
  const heroRows=frontierOf(cg.configs);
  const sections=TASK_ORDER.map(k=>{
    const t=TASKS[k];
    const rows=[...t.configs].sort((a,b)=>a.cpet-b.cpet).map((c,i)=>`<tr>
      <td>${i+1}</td><td>${esc(c.name)}${footnote(c.id)}</td>
      <td class="num">${c.q.toFixed(3)}</td><td class="num">${pct(c.rel)}</td>
      <td class="num">${money(c.cpet)}</td><td class="num">${c.eff}</td><td class="num">${pct(c.waste/100)}</td></tr>`).join("");
    return `<h2 class="sect">${t.name} (${t.cn})</h2>
      <p class="small muted">${t.seed} · ${t.license} · ${t.instances} instances. Contamination: disclosed (pre-2023 public seed${k==="extraction"?"; ExtractBench slice is fresh":""}).</p>
      <p>${t.diagnosis[0]}${footnote(t.configs[0].id)}</p>
      <figure>${scatterSVG(t.configs)}<figcaption>Quality–CPET frontier. Dashed line marks the Pareto frontier; every point links to its configuration, cost rows, and traces.</figcaption></figure>
      <p>${t.suggestions[0]}${footnote(t.configs[0].id)}</p>
      <div class="appendix"><div class="small muted" style="margin-bottom:6px">Appendix — full ranking (evidence: ¹ config · ² cost · ³ trace)</div>
        <table><thead><tr><th>#</th><th>Task Configuration</th><th class="num">Quality</th><th class="num">Reliability</th><th class="num">CPET</th><th class="num">Effective</th><th class="num">Waste</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");

  return `<div class="vB wrap"><div class="prose">
    <div class="mast">
      <h1 style="margin:0">Task Economics Report — v1</h1>
      <div class="small muted">tokencamp benchmarks · ${RUN.date} · Benchmark Run ${RUN.id} · ${RUN.matrix}</div>
    </div>
    <div class="fake-banner">PROTOTYPE — every number below is fake data for format review. Links point at the artifact paths of the settled schema, not real files.</div>
    <div class="hero">
      <div class="small muted" style="letter-spacing:.08em;text-transform:uppercase">How much does a customer pay to complete an effective task?</div>
      <div class="big">${cg.headline}</div>
      <div class="muted">per effective task on the flagship benchmark — code generation, medium difficulty tier, ${cg.headCfg}${footnote("cg-kimi-ss")}</div>
      <div class="small muted" style="margin-top:10px">${TASK_ORDER.map(k=>`${TASKS[k].name}: ${TASKS[k].headline}`).join(" · ")}</div>
    </div>

    <h2 class="sect">Executive summary</h2>
    <p>Across the four task types, the cost of a completed task varies by two orders of magnitude: ${money(Math.min(...TASK_ORDER.map(k=>Math.min(...TASKS[k].configs.map(c=>c.cpet)))))} for the cheapest structured extraction configuration to ${money(Math.max(...TASK_ORDER.map(k=>Math.max(...TASKS[k].configs.map(c=>c.cpet)))))} for an agentic repository fix. The difference is not mainly model price — it is retry structure: an agentic task that fails late has already spent 86 attempts. The headline number above is the CPET of the quality-gated frontier configuration on the flagship benchmark.</p>
    <p>CPET counts every attempt, including failures and retries. A configuration is “effective” only when its outcome passes the quality gate (score exactly 1.0). Waste — spend on attempts that did not become effective tasks — is the report’s efficiency lens.</p>

    <h2 class="sect">Where the money goes</h2>
    <p>The flagship configuration spends 34% of its budget on attempts that never become effective tasks. On the agentic type that figure is 52%.</p>
    <figure>${bars([
      {label:"codegen · kimi single-shot",pass:66,fail:34},
      {label:"extraction · kimi single-shot",pass:78,fail:22},
      {label:"corpus Q&A · kimi single-shot",pass:70,fail:30},
      {label:"agentic · kimi ReAct loop",pass:48,fail:52}])}
      <figcaption>Spend split per flagship configuration: passing attempts vs failed attempts and retries.</figcaption></figure>

    ${sections}

    <h2 class="sect">Methodology</h2>
    <p class="small">Every score links to three pieces of evidence in the run artifact${footnote("cg-kimi-ss")}: the Task Configuration snapshot (model, prompt/context, tools, agent loop, runtime — manifest.json, configHash 9f3a…), the attempt-level cost rows (usage, cache tokens, spend — summary.json / results.jsonl), and the trace with its verification block (gate verdict, score, per-unit detail — results.jsonl). Quality Gate = score exactly 1.0; Reliability = gate-passing epochs ÷ epochs (${RUN.epochs}); CPET = total spend ÷ effective tasks. Difficulty tiers are calibration-derived. All public seeds are pre-2023; contamination is disclosed per dataset. Scores are reproducible: pin the run id and configHash.</p>
    <footer class="small muted" style="margin-top:26px;border-top:1px solid var(--line);padding-top:10px">Published by tokencamp benchmarks · ${RUN.matrix} · calls routed through the tokencamp API.</footer>
  </div></div>`;
}

/* =========================== VARIANT C =========================== */
/* "Dashboard" — KPI cards, the frontier as the centerpiece, filter
   chips, ranking table, and a click-to-evidence side panel. */
function renderC(){
  const cg=TASKS.codegen;
  const kpis=[
    ["Headline CPET", cg.headline, "codegen · medium · gate = 1.0"],
    ["Effective tasks", "189 / 288", "flagship config, this run"],
    ["Waste share", "34%", "spend on failed attempts"],
    ["Configs on frontier", String(frontierOf(cg.configs).length), "of "+cg.configs.length+" tested"],
  ];
  const chip=(k,i)=>`<span class="chip ${i===0?"on":""}" data-t="${k}">${TASKS[k].name}</span>`;
  const typeBlock=(k)=>`
    <section data-type="${k}">
      <div class="chips">${TASK_ORDER.map(chip).join("")}
        <span class="small muted" style="align-self:center">| tier: ${DIFF_TIERS.map(t=>`<span class="chip chip-tier" data-tier="${t}">${t}</span>`).join("")}</span>
      </div>
      <figure>${scatterSVG(TASKS[k].configs)}<figcaption class="small muted">Click a point for its evidence (config · cost · trace). Dashed line = Pareto frontier.</figcaption></figure>
      <div class="card" style="margin-top:12px"><strong>Efficiency diagnosis</strong><ul class="small">${TASKS[k].diagnosis.map(d=>`<li>${d}</li>`).join("")}</ul></div>
      <div class="card" style="margin-top:10px"><strong>Optimization suggestions</strong><ul class="small">${TASKS[k].suggestions.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    </section>`;
  return `<div class="vC wrap">
    <div class="full" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;padding:14px 0 4px">
      <div><h1 style="margin:0">Task Economics <span class="muted" style="font-weight:400">· dashboard</span></h1>
      <div class="small muted">${RUN.id} · ${RUN.date} · epochs ${RUN.epochs} · ${RUN.matrix}</div></div>
      <div class="fake-banner" style="margin:0">PROTOTYPE — every number is fake data for format review.</div>
    </div>
    <div class="full kpis">${kpis.map(kp=>`<div class="card kpi"><div class="v">${kp[1]}</div><div>${kp[0]}</div><div class="small muted">${kp[2]}</div></div>`).join("")}</div>
    <div>${TASK_ORDER.map(typeBlock).join("")}</div>
    <div id="evpanel"><div class="card">
      <div class="small muted" style="letter-spacing:.06em;text-transform:uppercase">Evidence — every score links to</div>
      <p class="small" style="margin:8px 0 12px">Click a point on the chart (or a row below) to see what its score links to.</p>
      <div id="evbody" class="small muted">Nothing selected yet.</div>
    </div>
    <div class="card" style="margin-top:12px"><strong>Task cost ranking</strong> <span class="small muted">(flagship type)</span>
      <table class="small" style="margin-top:6px"><thead><tr><th>Config</th><th class="num">CPET</th><th class="num">Q</th></tr></thead>
      <tbody id="rankbody"></tbody></table>
    </div></div>
  </div>`;
}
function renderRank(k="codegen"){
  const rows=[...TASKS[k].configs].sort((a,b)=>a.cpet-b.cpet).slice(0,5);
  const el=document.getElementById("rankbody");
  if(!el) return;
  el.innerHTML=rows.map(r=>`<tr><td><a href="#" data-ev="${r.id}" data-name="${esc(r.name)}" data-q="${r.q}" data-cpet="${r.cpet}" data-rel="${r.rel}">${esc(r.name)}</a></td><td class="num">${money(r.cpet)}</td><td class="num">${r.q.toFixed(3)}</td></tr>`).join("");
}
function showEvidence(cfgId, name, q, cpet, rel){
  const el=document.getElementById("evbody");
  if(!el) return;
  el.innerHTML=`<strong>${esc(name)}</strong>
    <div class="small" style="margin:6px 0">Quality ${Number(q).toFixed(3)} · CPET ${money(Number(cpet))} · Reliability ${pct(Number(rel))}</div>
    <div class="small" style="display:flex;flex-direction:column;gap:6px">
      <a href="${RUN.dir}/manifest.json#cfg=${cfgId}">⚙ Task Configuration snapshot — model, prompt/context, tools, agent loop, runtime (configHash 9f3a…)</a>
      <a href="${RUN.dir}/summary.json#cost-${cfgId}">$ Cost rows — per-attempt usage, cache tokens, spend (summary.json / results.jsonl)</a>
      <a href="${RUN.dir}/results.jsonl#attempt=${RUN.id}.2.${cfgId}.1">⧉ Trace — ${RUN.id}.2.${cfgId}.1 + verification block (gate, score, per-unit)</a>
    </div>`;
}

/* --------------------------- switcher --------------------------- */
const VARIANTS={a:"A · Leaderboard",b:"B · Narrative",c:"C · Dashboard"};
function currentVariant(){return new URLSearchParams(location.search).get("variant")||"a"}
function render(){
  const v=currentVariant();
  document.getElementById("app").innerHTML=v==="b"?renderB():v==="c"?renderC():renderA();
  document.getElementById("swlabel").textContent=VARIANTS[v]||VARIANTS.a;
  wireVariant(v);
}
function wireVariant(v){
  if(document._evHandler){document.removeEventListener("click",document._evHandler);document._evHandler=null;}
  if(v==="a"){
    document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
      const layer=t.dataset.l;
      document.querySelectorAll("[data-layer]").forEach(s=>s.hidden=s.dataset.layer!==layer);
    });
    document.querySelectorAll(".subtab").forEach(t=>t.onclick=()=>{
      const scope=t.closest("section");
      scope.querySelectorAll(".subtab").forEach(x=>x.classList.toggle("on",x===t));
      if(t.dataset.t){scope.querySelectorAll(".taskpanel").forEach(p=>p.hidden=p.dataset.t!==t.dataset.t);
        scope.querySelector("figure").innerHTML=scatterSVG(TASKS[t.dataset.t].configs);}
    });
  }
  if(v==="c"){
    renderRank();
    const wrap=document.querySelector(".vC > div:not(#evpanel):not(.full)")||document;
    wrap.querySelectorAll("[data-type]").forEach((s,i)=>s.style.display=i===0?"":"none");
    document.querySelectorAll(".chip[data-t]").forEach(c=>c.onclick=()=>{
      document.querySelectorAll(".chip[data-t]").forEach(x=>x.classList.toggle("on",x===c));
      wrap.querySelectorAll("[data-type]").forEach(s=>s.style.display=s.dataset.type===c.dataset.t?"":"none");
      renderRank(c.dataset.t);
    });
    document.querySelectorAll(".chip-tier").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
    document._evHandler=function h(e){
      const sv=e.target.closest&&e.target.closest("circle");
      const rk=e.target.closest&&e.target.closest("a[data-ev]");
      if(sv){const t=sv.querySelector("title").textContent.split(" · ")[0];
        const cfg=Object.values(TASKS).flatMap(x=>x.configs).find(x=>x.name===t);
        if(cfg)showEvidence(cfg.id,cfg.name,cfg.q,cfg.cpet,cfg.rel);}
      else if(rk){e.preventDefault();showEvidence(rk.dataset.ev,rk.dataset.name,rk.dataset.q,rk.dataset.cpet,rk.dataset.rel);}
    };
    document.addEventListener("click",document._evHandler);
  }
}
function setVariant(v){
  try{const u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u);}
  catch(e){/* file:// without history support: fall through, in-memory only */}
  render();
}
document.getElementById("prev").onclick=()=>{const k=Object.keys(VARIANTS),i=k.indexOf(currentVariant());setVariant(k[(i-1+k.length)%k.length]);};
document.getElementById("next").onclick=()=>{const k=Object.keys(VARIANTS),i=k.indexOf(currentVariant());setVariant(k[(i+1)%k.length]);};
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement&&document.activeElement.isContentEditable) return;
  if(e.key==="ArrowLeft")document.getElementById("prev").click();
  if(e.key==="ArrowRight")document.getElementById("next").click();
});
render();
</script>
</body>
